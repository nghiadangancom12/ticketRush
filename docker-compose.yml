services:
  # ═══════════════════════════════════════════════════════════════
  # DATABASE-PER-SERVICE: 4 Postgres Containers Độc Lập
  # ═══════════════════════════════════════════════════════════════

  postgres-auth:
    image: postgres:16
    container_name: ticketrush-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-catalog:
    image: postgres:16
    container_name: ticketrush-postgres-catalog
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: catalog_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-booking:
    image: postgres:16
    container_name: ticketrush-postgres-booking
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: booking_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d booking_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-analytics:
    image: postgres:16
    container_name: ticketrush-postgres-analytics
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics_db
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d analytics_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticketrush-redis
    restart: always
    ports:
      - "6379:6379"

  # ═══════════════════════════════════════════════════════════════
  # CORE API — Monolith Fallback (Strangler Fig Pattern)
  # ═══════════════════════════════════════════════════════════════

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketrush-api
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ticketrush_uploads:/app/public/img
    env_file:
      - .env
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://user:password@postgres-auth:5432/auth_db?connection_limit=20
      - DIRECT_URL=postgresql://user:password@postgres-auth:5432/auth_db
      - AUTH_DATABASE_URL=postgresql://user:password@postgres-auth:5432/auth_db?connection_limit=10
      - CATALOG_DATABASE_URL=postgresql://user:password@postgres-catalog:5432/catalog_db?connection_limit=10
      - BOOKING_DATABASE_URL=postgresql://user:password@postgres-booking:5432/booking_db?connection_limit=20
      - ANALYTICS_DATABASE_URL=postgresql://user:password@postgres-analytics:5432/analytics_db?connection_limit=5
      - QUEUE_SERVICE_URL=http://virtual-queue-service:3001
      - BOOKING_SERVICE_URL=http://booking-service:3040
    depends_on:
      postgres-auth:
        condition: service_healthy
      postgres-catalog:
        condition: service_healthy
      postgres-booking:
        condition: service_healthy
      redis:
        condition: service_started

  # ═══════════════════════════════════════════════════════════════
  # IAM SERVICE — Authentication, Identity & Access Management
  # (Thay thế auth-service + user-service)
  # ═══════════════════════════════════════════════════════════════

  iam-service:
    build:
      context: .                                      # Root context — bắt buộc để COPY shared/
      dockerfile: services/iam-service/Dockerfile
    container_name: ticketrush-iam-service
    restart: always
    ports:
      - "3010:3010"
    volumes:
      - ticketrush_uploads:/app/public/img
    env_file:
      - .env
    environment:
      - IAM_PORT=3010
      - AUTH_DATABASE_URL=postgresql://user:password@postgres-auth:5432/auth_db?connection_limit=15
      - DATABASE_URL=postgresql://user:password@postgres-auth:5432/auth_db?connection_limit=15
      - DIRECT_URL=postgresql://user:password@postgres-auth:5432/auth_db
      - REDIS_URL=redis://redis:6379
      - BOOKING_SERVICE_URL=http://booking-service:3040
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_started

  # ═══════════════════════════════════════════════════════════════
  # DOMAIN MICROSERVICES
  # ═══════════════════════════════════════════════════════════════

  event-catalog-service:
    build:
      context: .
      dockerfile: services/event-catalog-service/Dockerfile
    container_name: ticketrush-event-catalog
    restart: always
    ports:
      - "3030:3030"
    volumes:
      - ticketrush_uploads:/app/public/img
    env_file:
      - .env
    environment:
      - EVENT_CATALOG_PORT=3030
      - REDIS_URL=redis://redis:6379
      - BOOKING_SERVICE_URL=http://booking-service:3040
      - AUTH_DATABASE_URL=postgresql://user:password@postgres-auth:5432/auth_db?connection_limit=5
      - CATALOG_DATABASE_URL=postgresql://user:password@postgres-catalog:5432/catalog_db?connection_limit=10
      - ANALYTICS_DATABASE_URL=postgresql://user:password@postgres-analytics:5432/analytics_db?connection_limit=5
      - DATABASE_URL=postgresql://user:password@postgres-catalog:5432/catalog_db?connection_limit=10
      - DIRECT_URL=postgresql://user:password@postgres-catalog:5432/catalog_db
    depends_on:
      postgres-catalog:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_started

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: ticketrush-booking-service
    restart: always
    ports:
      - "3040:3040"
    env_file:
      - .env
    environment:
      - BOOKING_PORT=3040
      - REDIS_URL=redis://redis:6379
      - AUTH_DATABASE_URL=postgresql://user:password@postgres-auth:5432/auth_db?connection_limit=5
      - BOOKING_DATABASE_URL=postgresql://user:password@postgres-booking:5432/booking_db?connection_limit=30
      - DATABASE_URL=postgresql://user:password@postgres-booking:5432/booking_db?connection_limit=30
      - DIRECT_URL=postgresql://user:password@postgres-booking:5432/booking_db
    depends_on:
      postgres-booking:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_started

  # ═══════════════════════════════════════════════════════════════
  # INFRASTRUCTURE SERVICES
  # ═══════════════════════════════════════════════════════════════

  virtual-queue-service:
    build:
      context: .
      dockerfile: services/queue-service/Dockerfile
    container_name: ticketrush-virtual-queue
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - QUEUE_PORT=3001
      - REDIS_URL=redis://redis:6379
      - AUTH_DATABASE_URL=postgresql://user:password@postgres-auth:5432/auth_db?connection_limit=5
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_started

  realtime-socket-gateway:
    build:
      context: .
      dockerfile: services/socket-gateway/Dockerfile
    container_name: ticketrush-socket-gateway
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - SOCKET_PORT=3002
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_started

  # ═══════════════════════════════════════════════════════════════
  # BACKGROUND WORKERS (Dockerfiles riêng, không dùng monolith image)
  # ═══════════════════════════════════════════════════════════════

  worker-queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketrush-worker-queue
    restart: always
    command: ["node", "modules/jobs/workers/queueWorker.js"]
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_started

  worker-email:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketrush-worker-email
    restart: always
    command: ["node", "modules/jobs/workers/emailWorker.js"]
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - BOOKING_DATABASE_URL=postgresql://user:password@postgres-booking:5432/booking_db?connection_limit=5
      - DATABASE_URL=postgresql://user:password@postgres-booking:5432/booking_db?connection_limit=5
      - DIRECT_URL=postgresql://user:password@postgres-booking:5432/booking_db
    depends_on:
      postgres-booking:
        condition: service_healthy
      redis:
        condition: service_started

  worker-seat-release:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketrush-worker-release
    restart: always
    command: ["node", "modules/jobs/workers/seatReleaseWorker.js"]
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - BOOKING_DATABASE_URL=postgresql://user:password@postgres-booking:5432/booking_db?connection_limit=5
      - DATABASE_URL=postgresql://user:password@postgres-booking:5432/booking_db?connection_limit=5
      - DIRECT_URL=postgresql://user:password@postgres-booking:5432/booking_db
    depends_on:
      postgres-booking:
        condition: service_healthy
      redis:
        condition: service_started

  worker-analytics-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketrush-worker-analytics
    restart: always
    command: ["node", "modules/jobs/workers/analyticsSyncWorker.js"]
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - ANALYTICS_DATABASE_URL=postgresql://user:password@postgres-analytics:5432/analytics_db?connection_limit=5
    depends_on:
      postgres-analytics:
        condition: service_healthy
      redis:
        condition: service_started

  # ═══════════════════════════════════════════════════════════════
  # GATEWAY — Kong làm Primary API Gateway (Port 80)
  # Nginx bị loại khỏi role reverse proxy
  # ═══════════════════════════════════════════════════════════════

  kong:
    image: kong:latest
    container_name: ticketrush-kong-gateway
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml:ro
    ports:
      - "80:8000"      # Kong là entry point duy nhất trên port 80
      - "8001:8001"    # Kong Admin API (dev/ops only)
    depends_on:
      - api
      - iam-service
      - virtual-queue-service
      - realtime-socket-gateway
      - event-catalog-service
      - booking-service

volumes:
  ticketrush_uploads:
