_format_version: "3.0"
_transform: true

services:
  # 1. Auth Service (:3010)
  - name: auth-service
    url: http://auth-service:3010
    routes:
      - name: auth-route
        paths:
          - /api/auth
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  # 2. Event Catalog Service (:3030)
  - name: event-catalog-service
    url: http://event-catalog-service:3030
    routes:
      - name: events-route
        paths:
          - /api/events
          - /api/categories
          - /api/admin
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 500
          policy: local

  # 3. Booking & Order Service (:3040)
  - name: booking-service
    url: http://booking-service:3040
    routes:
      - name: booking-route
        paths:
          - /api/booking
          - /api/Booking
          - /api/orders
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local

  # 4. User & Customer Service (:3020)
  - name: user-service
    url: http://user-service:3020
    routes:
      - name: user-route
        paths:
          - /api/users
          - /api/customers
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  # 5. Virtual Queue Service (:3001)
  - name: virtual-queue-service
    url: http://virtual-queue-service:3001
    routes:
      - name: queue-route
        paths:
          - /api/queue
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 200
          policy: local

  # 6. Realtime WebSocket Gateway (:3002) - Cấu hình giao thức ws và wss
  - name: socket-gateway
    url: http://realtime-socket-gateway:3002
    routes:
      - name: socket-route
        paths:
          - /socket.io
        protocols:
          - http
          - https
          - ws
          - wss
        strip_path: false

  # 7. Core API Monolith Fallback (:3000)
  - name: core-api
    url: http://api:3000
    routes:
      - name: monolith-fallback-route
        paths:
          - /
        strip_path: false

plugins:
  # Global CORS Plugin
  - name: cors
    config:
      origins:
        - "http://localhost:5173"
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Authorization
      credentials: true
      max_age: 3600

  # Global Prometheus Observability Plugin
  - name: prometheus
