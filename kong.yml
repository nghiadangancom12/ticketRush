_format_version: "3.0"
_transform: true

services:
  # ─── 1. IAM Service — Authentication, Identity & Access Management (:3010) ──
  - name: iam-service
    url: http://iam-service:3010
    routes:
      - name: auth-route
        paths:
          - /api/auth
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 30        # Strict — chống brute-force login
          policy: local

      - name: rate-limiting
        config:
          minute: 30
          policy: local
        tags:
          - auth

  - name: iam-users-route
    url: http://iam-service:3010
    routes:
      - name: users-route
        paths:
          - /api/users
          - /api/customers
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  # ─── 2. Event Catalog Service (:3030) ────────────────────────────────────────
  - name: event-catalog-service
    url: http://event-catalog-service:3030
    routes:
      - name: events-route
        paths:
          - /api/events
          - /api/categories
          - /api/admin
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 500
          policy: local

  # ─── 3. Booking Service (:3040) ──────────────────────────────────────────────
  - name: booking-service
    url: http://booking-service:3040
    routes:
      - name: booking-route
        paths:
          - /api/booking
          - /api/Booking
          - /api/orders
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 30        # Strict — booking là critical path
          policy: local

  # ─── 4. Virtual Queue Service (:3001) ────────────────────────────────────────
  - name: virtual-queue-service
    url: http://virtual-queue-service:3001
    routes:
      - name: queue-route
        paths:
          - /api/queue
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 200
          policy: local

  # ─── 5. Realtime WebSocket Gateway (:3002) ───────────────────────────────────
  - name: socket-gateway
    url: http://realtime-socket-gateway:3002
    routes:
      - name: socket-route
        paths:
          - /socket.io
        protocols:
          - http
          - https
          - ws
          - wss
        strip_path: false

  # ─── 6. Core API Monolith Fallback (:3000) — Strangler Fig Pattern ──────────
  - name: core-api
    url: http://api:3000
    routes:
      - name: monolith-fallback-route
        paths:
          - /
        strip_path: false

plugins:
  # ─── Global CORS Plugin ───────────────────────────────────────────────────────
  # ⚠️  KHÔNG dùng wildcard "*" khi credentials: true (trình duyệt sẽ block).
  # Thêm domain production vào origins khi deploy lên server thật.
  - name: cors
    config:
      origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        # Thêm production URL ở đây khi deploy:
        # - "https://yourdomain.com"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  # ─── Global Prometheus Observability ─────────────────────────────────────────
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
