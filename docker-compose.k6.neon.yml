services:
  redis:
    image: redis:7-alpine
    container_name: ticketrush-redis-k6-neon
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: ticketrush-api-k6-neon
    restart: unless-stopped
    command: ["node", "server.js"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: test
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-200000}
      QUEUE_JOIN_RATE_LIMIT_MAX: ${QUEUE_JOIN_RATE_LIMIT_MAX:-50000}
      QUEUE_JOIN_RATE_LIMIT_WINDOW_MS: ${QUEUE_JOIN_RATE_LIMIT_WINDOW_MS:-10000}
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
